name: Publish to npm

# Publishes the package to npm WITH provenance (required by n8n for verified
# community nodes). Runs when a GitHub Release is published, or manually.
#
# Auth: npm "trusted publishing" (OIDC). The repository + this workflow are
# registered as a trusted publisher for the package on npmjs.com, so NO
# NPM_TOKEN is needed — npm (>= 11.5) exchanges the GitHub OIDC token at
# publish time. Deliberately no NODE_AUTH_TOKEN: an empty token value would
# shadow the OIDC login.

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # required for OIDC trusted publishing + provenance

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'

      # npm >= 11.5 is required for OIDC trusted publishing.
      - run: npm install -g npm@latest

      - run: npm ci

      - run: npm run build

      - run: npm publish --provenance --access public
