name: Publish to npm

# Publishes the package to npm WITH provenance (required by n8n for verified
# community nodes). Runs when a GitHub Release is published, or manually.
#
# Auth: uses npm "trusted publishing" (OIDC) — no NPM_TOKEN needed once the
# repository + this workflow are registered as a trusted publisher for the
# package on npmjs.com. (Alternatively, set an NPM_TOKEN secret; it is picked
# up via NODE_AUTH_TOKEN below.)

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # required for npm provenance

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'

      # npm >= 11.5 is required for OIDC trusted publishing.
      - run: npm install -g npm@latest

      - run: npm ci

      - run: npm run build

      - run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
