name: Publish to npm

# Publishes the package to npm WITH provenance (required by n8n for verified
# community nodes). Runs when a GitHub Release is published, or manually.
#
# Publishing goes through `npm run release` (= `n8n-node release`). Inside a
# GitHub Action it runs lint + build, then `npm publish` with RELEASE_MODE and
# NPM_CONFIG_PROVENANCE=true. Auth is npm "trusted publishing" (OIDC): this repo
# + workflow are registered as a trusted publisher for the package on npmjs.com,
# so NO NPM_TOKEN is needed — npm (>= 11.5) exchanges the GitHub OIDC token.

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # required for OIDC trusted publishing + provenance

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'

      # npm >= 11.5 is required for OIDC trusted publishing.
      - run: npm install -g npm@latest

      - run: npm ci

      # n8n-node release detects GITHUB_ACTIONS and runs lint + build + publish
      # (with provenance). Does NOT bump the version — publishes package.json's.
      - run: npm run release
